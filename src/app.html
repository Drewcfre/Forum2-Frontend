<!doctype html>
<html lang="en" data-theme="light">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Forum2 — Board</title>

	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			darkMode: ['class', '[data-theme="dark"]'],
			theme: {
				extend: {
					colors: {
						primary: {
							light: '#2563eb', // blue-600
							dark: '#60a5fa',  // blue-400
						},
						accent: {
							light: '#f43f5e', // rose-500
							dark: '#fb7185',  // rose-400
						},
						muted: {
							light: '#f7f7f8',
							dark: '#1e1e22',
						},
					}
				}
			}
		}
	</script>

	<style>
		.banner-geo {
			background-image:
					linear-gradient(135deg, rgba(0,0,0,0.05) 25%, transparent 25%),
					linear-gradient(225deg, rgba(0,0,0,0.05) 25%, transparent 25%);
			background-size: 20px 20px;
			background-position: 0 0, 10px 10px;
		}
		.sidebar-collapsed { width: 4rem !important; }
	</style>
</head>
<body class="bg-muted-light dark:bg-muted-dark text-gray-900 dark:text-gray-100 transition-colors">
<div class="min-h-screen flex">
	<!-- SIDEBAR -->
	<aside id="sidebar" class="w-64 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col transition-all duration-300">
		<div class="p-4 flex items-center gap-3 border-b border-gray-100 dark:border-gray-800">
			<img src="/favicon.svg" alt="Forum2 logo" class="w-10 h-10" />
			<div id="sidebar-label">
				<div class="font-bold text-lg">Forum2</div>
				<div class="text-xs text-gray-500 dark:text-gray-400">Community boards</div>
			</div>
		</div>

		<nav class="flex-1 p-3 overflow-auto">
			<ul class="space-y-2">
				<li><a class="block px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800" href="#">Home</a></li>
				<li><a class="block px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800" href="#">Boards</a></li>
				<li><a class="block px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800" href="#">Create Thread</a></li>
				<li><a class="block px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800" href="#">Profile</a></li>
				<li><a class="block px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800" href="#">Login</a></li>
			</ul>
		</nav>

		<div class="p-4 border-t border-gray-100 dark:border-gray-800 flex justify-between items-center">
			<button class="rounded-lg px-3 py-1 text-sm font-medium bg-primary-light dark:bg-primary-dark text-white">
				New Thread
			</button>
			<button id="sidebarToggle" class="text-gray-500 hover:text-accent-light dark:hover:text-accent-dark">
				☰
			</button>
		</div>
	</aside>

	<!-- MAIN -->
	<main class="flex-1 flex flex-col">
		<!-- TOP BANNER -->
		<header class="banner-geo p-4 border-b border-gray-200 dark:border-gray-700 bg-white/90 dark:bg-gray-900/90">
			<div class="max-w-7xl mx-auto flex items-start justify-between gap-4">
				<div>
					<h1 class="text-2xl font-extrabold tracking-tight text-primary-light dark:text-primary-dark">/board/name</h1>
					<p class="text-sm text-gray-600 dark:text-gray-400">Brief summary: what this board is for and a one-line rules reminder.</p>
				</div>
				<div class="flex items-center gap-3">
					<button id="themeToggle" class="text-sm px-2 py-1 border rounded-md hover:bg-gray-100 dark:hover:bg-gray-800">
						Toggle Theme
					</button>
				</div>
			</div>
		</header>

		<!-- THREAD GRID -->
		<section class="p-6 max-w-7xl mx-auto flex-1">
			<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
				<article class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm hover:shadow-lg transition transform hover:-translate-y-1 hover:scale-[1.02] p-4 flex flex-col justify-between">
					<div>
						<h2 class="font-semibold text-lg leading-tight text-primary-light dark:text-primary-dark">Thread title</h2>
						<p class="text-xs text-gray-400 mt-1">by <span class="font-medium">user123</span> · 2 hours ago</p>
						<p class="text-sm text-gray-600 dark:text-gray-300 mt-3 line-clamp-3">Quick thread excerpt for preview purposes...</p>
					</div>
					<div class="mt-4 flex items-center justify-between">
						<div class="flex items-center gap-2">
							<span class="inline-block px-2 py-1 text-xs border rounded-full">tag</span>
						</div>
						<a href="#" class="text-sm text-accent-light dark:text-accent-dark hover:underline">Open</a>
					</div>
				</article>
			</div>
		</section>
	</main>
</div>

<script>
	// Theme toggle
	document.getElementById('themeToggle').addEventListener('click', () => {
		const root = document.documentElement;
		const newTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
		root.setAttribute('data-theme', newTheme);
	});

	// Sidebar collapse
	document.getElementById('sidebarToggle').addEventListener('click', () => {
		const sidebar = document.getElementById('sidebar');
		sidebar.classList.toggle('sidebar-collapsed');
		const label = document.getElementById('sidebar-label');
		label.classList.toggle('hidden');
	});
</script>
</body>
</html>
